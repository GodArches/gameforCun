<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nature Trail – Ôn từ vựng Unit 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #E7F4EF;
  --bg-2: #D3ECE3;
  --surface: #FFFFFF;
  --ink: #153A37;
  --ink-soft: #4C6B67;
  --sea: #1C82A6;
  --sea-soft: #D6EEF6;
  --sun: #F4B23C;
  --sun-soft: #FFF1D3;
  --leaf: #2F8C55;
  --leaf-soft: #DDF3E5;
  --coral: #D9573A;
  --coral-soft: #FBE3DC;
  --line: #B9D9CE;
  --shadow: 0 3px 0 #B9D9CE;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F2422; --bg-2: #15302D; --surface: #1B3936; --ink: #E8F5F1; --ink-soft: #A9C6C0;
    --sea: #5CB9DA; --sea-soft: #173D4A; --sun: #F4C060; --sun-soft: #3D331C; --leaf: #6CCB92; --leaf-soft: #17402A;
    --coral: #F08468; --coral-soft: #4A2620; --line: #2E524D; --shadow: 0 3px 0 #0A1917; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F2422; --bg-2: #15302D; --surface: #1B3936; --ink: #E8F5F1; --ink-soft: #A9C6C0;
  --sea: #5CB9DA; --sea-soft: #173D4A; --sun: #F4C060; --sun-soft: #3D331C; --leaf: #6CCB92; --leaf-soft: #17402A;
  --coral: #F08468; --coral-soft: #4A2620; --line: #2E524D; --shadow: 0 3px 0 #0A1917; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Baloo 2", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  font-size: 18px; line-height: 1.45; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--sea); outline-offset: 3px; }
img { max-width: 100%; display: block; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 2px solid var(--line);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.bar-in { max-width: 920px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.brand { font-weight: 800; font-size: 24px; letter-spacing: -0.01em; margin-right: auto; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; }
.brand svg { width: 30px; height: 30px; }
.sets { display: flex; background: var(--bg-2); border-radius: 999px; padding: 4px; gap: 2px; }
.sets button { border: 0; background: transparent; padding: 4px 14px; border-radius: 999px; font-weight: 600; font-size: 16px; color: var(--ink-soft); }
.sets button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.icon-btn { border: 2px solid var(--line); background: var(--surface); width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; }
.icon-btn svg { width: 22px; height: 22px; }

main { max-width: 920px; margin: 0 auto; padding: 18px 16px 48px; }

/* ---------- home / trail ---------- */
.intro { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; margin: 6px 0 18px; }
.intro h1 { font-size: clamp(34px, 6vw, 54px); line-height: 1; margin: 0; font-weight: 800; letter-spacing: -0.02em; }
.intro p { margin: 8px 0 0; color: var(--ink-soft); max-width: 46ch; }
.total-stars { text-align: right; font-weight: 700; color: var(--ink-soft); }
.total-stars b { display: block; font-size: 40px; line-height: 1; color: var(--ink); }
.trail { position: relative; padding: 10px 0 20px; }
.trail svg.path { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.trail svg.path path { fill: none; stroke: var(--sun); stroke-width: 5; stroke-dasharray: 2 14; stroke-linecap: round; }
.stop { position: relative; display: flex; align-items: center; gap: 16px; width: min(440px, 92%); margin: 0 0 22px; padding: 12px 18px 12px 12px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); text-align: left; }
.stop:nth-child(2) { margin-left: auto; margin-right: 4%; }
.stop:nth-child(3) { margin-left: 12%; }
.stop:nth-child(4) { margin-left: auto; margin-right: 0; }
.stop:nth-child(5) { margin-left: 4%; }
.stop:hover { border-color: var(--sea); }
.stop .num { flex: none; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-size: 28px; font-weight: 800; background: var(--sea); color: #fff; }
.stop:nth-child(even) .num { background: var(--leaf); }
.stop h2 { margin: 0; font-size: 22px; line-height: 1.15; }
.stop p { margin: 2px 0 0; color: var(--ink-soft); font-size: 16px; }
.stars { display: flex; gap: 2px; margin-left: auto; flex: none; }
.stars svg { width: 22px; height: 22px; }
.star-on { fill: var(--sun); }
.star-off { fill: var(--line); }
.review-btn { display: block; margin: 8px auto 0; border: 2px dashed var(--coral); background: var(--coral-soft); color: var(--ink); border-radius: 16px; padding: 10px 18px; font-weight: 700; }

/* ---------- play ---------- */
.play-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.back { border: 0; background: none; font-weight: 700; color: var(--ink-soft); padding: 6px 0; display: flex; gap: 6px; align-items: center; }
.back svg { width: 20px; height: 20px; }
.mode-name { font-weight: 800; font-size: 20px; }
.progress { flex: 1; height: 12px; background: var(--bg-2); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--leaf); border-radius: 999px; transition: width .3s; }
.score { font-weight: 800; font-size: 20px; min-width: 62px; text-align: right; }
.streak { font-size: 15px; color: var(--coral); font-weight: 700; min-height: 22px; text-align: right; }

.stage { background: var(--surface); border: 2px solid var(--line); border-radius: 28px; padding: 22px; box-shadow: var(--shadow); }
.prompt { font-size: 22px; font-weight: 700; margin: 0 0 14px; text-align: center; }
.pic { border-radius: 18px; overflow: hidden; margin: 0 auto; width: min(460px, 100%); background: #fff; }
.pic img { width: 100%; }
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
.opt { border: 2px solid var(--line); background: var(--surface); border-radius: 18px; padding: 14px 12px; font-size: 24px; font-weight: 700; box-shadow: var(--shadow); min-height: 64px; }
.opt:hover:not(:disabled) { border-color: var(--sea); }
.opt .k { font-size: 14px; color: var(--ink-soft); margin-right: 6px; font-weight: 600; }
.opt.right { background: var(--leaf-soft); border-color: var(--leaf); }
.opt.wrong { background: var(--coral-soft); border-color: var(--coral); }
.opt:disabled { cursor: default; }
.pic-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.pic-opt { padding: 6px; border-radius: 18px; border: 3px solid var(--line); background: #fff; }
.pic-opt img { border-radius: 12px; width: 100%; }
.pic-opt.right { border-color: var(--leaf); box-shadow: 0 0 0 4px var(--leaf-soft); }
.pic-opt.wrong { border-color: var(--coral); box-shadow: 0 0 0 4px var(--coral-soft); }
.speak-big { display: flex; margin: 0 auto; align-items: center; gap: 10px; border: 0; background: var(--sea); color: #fff; padding: 14px 26px; border-radius: 999px; font-size: 22px; font-weight: 700; box-shadow: 0 4px 0 #0F5E7A; }
.speak-big svg { width: 28px; height: 28px; }
.say-text { text-align: center; font-size: 30px; font-weight: 800; margin-top: 10px; }

.feedback { margin-top: 18px; border-radius: 18px; padding: 14px 18px; display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; }
.feedback.ok { background: var(--leaf-soft); }
.feedback.no { background: var(--coral-soft); }
.feedback h3 { margin: 0; font-size: 22px; }
.feedback p { margin: 0; color: var(--ink); }
.feedback .ex { color: var(--ink-soft); font-style: italic; }
.next { border: 0; background: var(--ink); color: var(--bg); font-weight: 800; font-size: 20px; padding: 12px 22px; border-radius: 16px; grid-row: span 3; }
.mini-speak { border: 0; background: none; color: var(--sea); padding: 0 4px; vertical-align: middle; }
.mini-speak svg { width: 22px; height: 22px; }

/* spelling */
.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 18px 0 8px; }
.slot { width: 42px; height: 52px; border-radius: 12px; border: 2px dashed var(--line); display: grid; place-items: center; font-size: 28px; font-weight: 800; background: var(--bg); padding: 0; }
.slot.filled { border-style: solid; border-color: var(--sea); background: var(--sea-soft); }
.slot.gap { border: 0; background: none; width: 18px; }
.slot.right { border-color: var(--leaf); background: var(--leaf-soft); }
.slot.wrong { border-color: var(--coral); background: var(--coral-soft); }
.tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; }
.tile { width: 50px; height: 54px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-size: 28px; font-weight: 800; box-shadow: var(--shadow); padding: 0; }
.tile:disabled { opacity: .25; box-shadow: none; }
.hint-row { display: flex; justify-content: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.ghost { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 8px 16px; font-weight: 700; }
.meaning { text-align: center; color: var(--ink-soft); font-size: 20px; margin-top: 10px; }

/* flashcards */
.flip { perspective: 1200px; width: min(480px, 100%); margin: 0 auto; }
.flip-in { position: relative; transition: transform .5s; transform-style: preserve-3d; cursor: pointer; aspect-ratio: 4 / 3.3; }
.flip.on .flip-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 24px; border: 2px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; text-align: center; }
.face img { border-radius: 16px; max-height: 82%; object-fit: contain; }
.face .tap { color: var(--ink-soft); font-size: 15px; margin-top: 8px; }
.back-face { transform: rotateY(180deg); background: var(--sun-soft); }
.back-face .w { font-size: clamp(34px, 7vw, 50px); font-weight: 800; line-height: 1.05; }
.back-face .ipa { color: var(--ink-soft); font-size: 20px; }
.back-face .vi { font-size: 26px; font-weight: 700; margin-top: 6px; }
.back-face .ex { color: var(--ink-soft); font-style: italic; margin-top: 8px; max-width: 34ch; }
.fc-nav { display: flex; justify-content: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 16px; padding: 12px 20px; font-weight: 800; font-size: 18px; box-shadow: var(--shadow); }
.btn.go { background: var(--leaf); color: #fff; box-shadow: 0 3px 0 #1E5E38; }
.btn.stay { background: var(--coral); color: #fff; box-shadow: 0 3px 0 #9A3722; }
.btn.plain { background: var(--surface); border: 2px solid var(--line); }

/* memory */
.mem-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.mem { aspect-ratio: 1 / 0.82; border-radius: 16px; border: 2px solid var(--line); background: var(--sea); position: relative; padding: 0; overflow: hidden; }
.mem::after { content: "?"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 40px; font-weight: 800; }
.mem .c { position: absolute; inset: 0; display: none; place-items: center; background: #fff; padding: 4px; }
.mem .c img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
.mem .c span { font-size: 20px; font-weight: 800; color: #153A37; line-height: 1.1; padding: 4px; }
.mem.open::after, .mem.done::after { content: none; }
.mem.open .c, .mem.done .c { display: grid; }
.mem.done { border-color: var(--leaf); box-shadow: 0 0 0 3px var(--leaf-soft); }
.mem.miss { border-color: var(--coral); }
.mem-info { display: flex; justify-content: space-between; margin-top: 12px; color: var(--ink-soft); font-weight: 700; }

/* result */
.result { text-align: center; }
.result h2 { font-size: 40px; margin: 0; line-height: 1.1; }
.result .big-stars { display: flex; justify-content: center; gap: 8px; margin: 14px 0; }
.result .big-stars svg { width: 58px; height: 58px; }
.result .sum { font-size: 22px; color: var(--ink-soft); }
.wrong-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 18px 0; text-align: left; }
.wrong-list div { background: var(--coral-soft); border-radius: 14px; padding: 6px; }
.wrong-list img { border-radius: 10px; }
.wrong-list b { display: block; font-size: 18px; padding: 4px 4px 0; }
.wrong-list span { display: block; font-size: 15px; color: var(--ink-soft); padding: 0 4px 2px; }
.result .fc-nav { margin-top: 8px; }

@media (max-width: 560px) {
  body { font-size: 17px; }
  .intro { grid-template-columns: 1fr; }
  .total-stars { text-align: left; }
  .stop, .stop:nth-child(n) { width: 100%; margin-left: 0; margin-right: 0; }
  .trail svg.path { display: none; }
  .stage { padding: 14px; border-radius: 22px; }
  .opt { font-size: 20px; }
  .mem-grid { grid-template-columns: repeat(3, 1fr); }
  .slot { width: 32px; height: 44px; font-size: 22px; }
  .slot.gap { width: 10px; }
  .tile { width: 42px; height: 48px; font-size: 24px; }
  .feedback { grid-template-columns: 1fr; }
  .next { grid-row: auto; }
  .sets button { padding: 4px 10px; font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) {
  .flip-in, .progress i { transition: none; }
}
</style>
</head>

  <button class="brand" id="home-btn" aria-label="Về bản đồ">

  </div>

</div></header>

// words whose pictures look alike are never offered as distractors for each other
const LOOKALIKE = [
  ["mountain", "mountain range", "scenery", "landscape", "national park"],
  ["sand", "sand dunes", "desert"],
  ["river", "landscape", "scenery"],
  ["rock", "cave"],
];
const MODES = [
  { id: "cards", name: "Thẻ từ", desc: "Lật thẻ, nghe và ghi nhớ từng từ" },
  { id: "pic", name: "Nhìn hình chọn từ", desc: "Xem tranh, chọn từ đúng" },
  { id: "listen", name: "Nghe chọn hình", desc: "Nghe từ, chọn bức tranh đúng" },
  { id: "spell", name: "Ghép chữ", desc: "Xếp các chữ cái thành từ đúng" },
  { id: "memory", name: "Lật thẻ trí nhớ", desc: "Tìm cặp tranh và từ giống nhau" },
];

/* ---------- utilities ---------- */
const $ = (s, el = document) => el.querySelector(s);
const app = $("#app");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const imgOf = w => IMG[w.w];
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const lookalike = (a, b) => LOOKALIKE.some(g => g.includes(a) && g.includes(b));
const STAR = on => `<svg viewBox="0 0 24 24" aria-hidden="true"><path class="${on ? "star-on" : "star-off"}" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>`;
const ICON_SPK = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zm-2.5-8.8v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>`;
const ICON_MUTE = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm15.6 3 2.2-2.2-1.4-1.4-2.2 2.2-2.2-2.2-1.4 1.4 2.2 2.2-2.2 2.2 1.4 1.4 2.2-2.2 2.2 2.2 1.4-1.4z"/></svg>`;
const ICON_BACK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>`;

const store = {
  get(k, d) { try { const v = localStorage.getItem("nt5:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("nt5:" + k, JSON.stringify(v)); } catch (e) {} },
};
let setId = store.get("set", "1");
let muted = store.get("muted", false);
let reviewList = store.get("review", []);

/* ---------- sound & speech ---------- */
let actx;
function beep(ok) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = ok ? [660, 880] : [300, 220];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = ok ? "triangle" : "sawtooth"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, actx.currentTime + i * 0.12);
      g.gain.exponentialRampToValueAtTime(0.12, actx.currentTime + i * 0.12 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + i * 0.12 + 0.18);
      o.connect(g).connect(actx.destination); o.start(actx.currentTime + i * 0.12); o.stop(actx.currentTime + i * 0.12 + 0.2);
    });
  } catch (e) {}
}
const canSpeak = "speechSynthesis" in window;
let voice = null;
function pickVoice() {
  if (!canSpeak) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /en-GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if (canSpeak) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text) {
  if (!canSpeak || muted) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-GB"; u.rate = 0.85; if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- header ---------- */
function paintHeader() {
  document.querySelectorAll(".sets button").forEach(b => b.setAttribute("aria-pressed", b.dataset.set === setId ? "true" : "false"));
  const m = $("#mute");
  m.innerHTML = muted ? ICON_MUTE : ICON_SPK;
  m.setAttribute("aria-label", muted ? "Bật âm thanh" : "Tắt âm thanh");
}
document.querySelectorAll(".sets button").forEach(b => b.addEventListener("click", () => {
  setId = b.dataset.set; store.set("set", setId); paintHeader(); home();
}));
$("#mute").addEventListener("click", () => { muted = !muted; store.set("muted", muted); if (muted && canSpeak) speechSynthesis.cancel(); paintHeader(); });
$("#home-btn").addEventListener("click", () => home());

const setWords = () => setId === "all" ? WORDS : WORDS.filter(w => String(w.set) === setId);
const setLabel = () => setId === "all" ? "cả 18 từ" : (setId === "1" ? "Bộ 1" : "Bộ 2");
const bestKey = m => `best:${m}:${setId}`;

/* ---------- home ---------- */
function home() {
  if (canSpeak) speechSynthesis.cancel();
  let total = 0;
  const stops = MODES.map((m, i) => {
    const s = store.get(bestKey(m.id), 0); total += s;
    return `<button class="stop" data-mode="${m.id}">
      <span class="num">${i + 1}</span>
      <span><h2>${m.name}</h2><p>${m.desc}</p></span>
      <span class="stars" aria-label="${s} trên 3 sao">${STAR(s > 0) + STAR(s > 1) + STAR(s > 2)}</span>
    </button>`;
  }).join("");
  const rv = reviewList.filter(w => WORDS.some(x => x.w === w));
  app.innerHTML = `
    <section class="intro">
      <div><h1>Đi hết 5 chặng</h1>
      <p>Ôn từ vựng thiên nhiên – Unit 5 (${setLabel()}, ${setWords().length} từ). Mỗi chặng được tối đa 3 sao. Nên đi lần lượt từ chặng 1.</p></div>
      <div class="total-stars"><b>${total}/15</b>sao đã nhặt</div>
    </section>
    <div class="trail"><svg class="path" aria-hidden="true"><path d=""/></svg>${stops}</div>
    ${rv.length ? `<button class="review-btn" id="review">Ôn lại ${rv.length} từ hay sai</button>` : ""}`;
  app.querySelectorAll(".stop").forEach(b => b.addEventListener("click", () => start(b.dataset.mode)));
  const r = $("#review"); if (r) r.addEventListener("click", () => start("pic", WORDS.filter(w => rv.includes(w.w))));
  requestAnimationFrame(drawTrail);
  window.scrollTo(0, 0);
}
function drawTrail() {
  const trail = $(".trail"); if (!trail) return;
  const box = trail.getBoundingClientRect();
  const pts = [...trail.querySelectorAll(".num")].map(n => { const r = n.getBoundingClientRect(); return [r.left - box.left + r.width / 2, r.top - box.top + r.height / 2]; });
  let d = "";
  pts.forEach((p, i) => {
    if (!i) { d = `M${p[0]},${p[1]}`; return; }
    const q = pts[i - 1], my = (q[1] + p[1]) / 2;
    d += ` C${q[0]},${my} ${p[0]},${my} ${p[0]},${p[1]}`;
  });
  $(".trail path").setAttribute("d", d);
}
window.addEventListener("resize", () => requestAnimationFrame(drawTrail));

/* ---------- shared play frame ---------- */
let S = null; // game state
function frame(inner, progress) {
  const m = MODES.find(x => x.id === S.mode);
  app.innerHTML = `
    <div class="play-top">
      <button class="back" id="back">${ICON_BACK} Bản đồ</button>
      <span class="mode-name">${m.name}</span>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(progress * 100)}"><i style="width:${progress * 100}%"></i></div>
      <span class="score">${S.score ?? ""}</span>
    </div>
    <div class="streak">${S.streak >= 3 ? `Chuỗi đúng ${S.streak} câu!` : ""}</div>
    <section class="stage">${inner}</section>`;
  $("#back").addEventListener("click", home);
}
function start(mode, custom) {
  const pool = custom || setWords();
  S = { mode, pool, i: 0, score: 0, streak: 0, wrong: [], custom: !!custom };
  if (mode === "cards") { S.queue = shuffle(pool); S.known = 0; return cardView(); }
  if (mode === "memory") return memoryStart();
  S.queue = shuffle(pool).slice(0, Math.min(10, pool.length));
  next();
}
function next() {
  if (S.i >= S.queue.length) return result();
  S.answered = false;
  ({ pic: picQ, listen: listenQ, spell: spellQ })[S.mode]();
}
function distractors(word, n) {
  const all = WORDS.filter(w => w.w !== word.w && !lookalike(w.w, word.w));
  const fromSet = shuffle(all.filter(w => S.pool.includes(w)));
  const rest = shuffle(all.filter(w => !S.pool.includes(w)));
  return fromSet.concat(rest).slice(0, n);
}
function mark(ok, word) {
  S.answered = true;
  if (ok) { S.streak++; S.score += 10 + (S.streak >= 3 ? 5 : 0); beep(true); }
  else { S.streak = 0; S.wrong.push(word); beep(false); }
  $(".score").textContent = S.score;
  $(".streak").textContent = S.streak >= 3 ? `Chuỗi đúng ${S.streak} câu!` : "";
}
function feedback(ok, word) {
  const fb = document.createElement("div");
  fb.className = "feedback " + (ok ? "ok" : "no");
  fb.innerHTML = `<h3>${ok ? "Đúng rồi!" : "Chưa đúng."} ${ok ? "" : "Đáp án:"} ${esc(word.w)}
      <button class="mini-speak" aria-label="Nghe lại">${ICON_SPK}</button></h3>
    <button class="next" id="next">${S.i + 1 >= S.queue.length ? "Xem kết quả" : "Câu tiếp"}</button>
    <p>${esc(word.ipa)} – ${esc(word.vi)}</p>
    <p class="ex">${esc(word.ex)}</p>`;
  $(".stage").appendChild(fb);
  fb.querySelector(".mini-speak").addEventListener("click", () => say(word.w));
  $("#next").addEventListener("click", () => { S.i++; next(); });
  $("#next").focus({ preventScroll: true });
  fb.scrollIntoView({ block: "nearest", behavior: "smooth" });
  say(word.w);
}

/* ---------- mode 2: picture → word ---------- */
function picQ() {
  const w = S.queue[S.i];
  const opts = shuffle([w, ...distractors(w, 3)]);
  frame(`<p class="prompt">Đây là gì?</p>
    <div class="pic"><img src="${imgOf(w)}" alt="Tranh minh hoạ"></div>
    <div class="options">${opts.map((o, k) => `<button class="opt" data-w="${esc(o.w)}"><span class="k">${k + 1}</span>${esc(o.w)}</button>`).join("")}</div>`,
    S.i / S.queue.length);
  app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    if (S.answered) return;
    const ok = b.dataset.w === w.w;
    app.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (x.dataset.w === w.w) x.classList.add("right"); });
    if (!ok) b.classList.add("wrong");
    mark(ok, w); feedback(ok, w);
  }));
}

/* ---------- mode 3: listen → picture ---------- */
function listenQ() {
  const w = S.queue[S.i];
  const opts = shuffle([w, ...distractors(w, 3)]);
  frame(`<p class="prompt">Nghe và chọn bức tranh đúng</p>
    <button class="speak-big" id="play">${ICON_SPK} Nghe từ</button>
    ${(!canSpeak || muted) ? `<div class="say-text">${esc(w.w)}</div><p class="meaning">Máy không phát được âm thanh – em hãy đọc từ trên rồi chọn tranh.</p>` : ""}
    <div class="pic-opts">${opts.map((o, k) => `<button class="pic-opt" data-w="${esc(o.w)}" aria-label="Tranh ${k + 1}"><img src="${imgOf(o)}" alt=""></button>`).join("")}</div>`,
    S.i / S.queue.length);
  $("#play").addEventListener("click", () => say(w.w));
  setTimeout(() => say(w.w), 300);
  app.querySelectorAll(".pic-opt").forEach(b => b.addEventListener("click", () => {
    if (S.answered) return;
    const ok = b.dataset.w === w.w;
    app.querySelectorAll(".pic-opt").forEach(x => { x.disabled = true; if (x.dataset.w === w.w) x.classList.add("right"); });
    if (!ok) b.classList.add("wrong");
    mark(ok, w); feedback(ok, w);
  }));
}

/* ---------- mode 4: spelling ---------- */
function spellQ() {
  const w = S.queue[S.i];
  const letters = w.w.replace(/ /g, "").split("");
  S.tiles = shuffle(letters.map((ch, k) => ({ ch, id: k })));
  while (S.tiles.length > 2 && S.tiles.map(t => t.ch).join("") === letters.join("")) S.tiles = shuffle(S.tiles);
  S.filled = []; S.hints = 0;
  frame(`<p class="prompt">Xếp chữ cái thành từ đúng</p>
    <div class="pic"><img src="${imgOf(w)}" alt="Tranh minh hoạ"></div>
    <p class="meaning">Gợi ý: ${esc(w.vi)}</p>
    <div class="slots" id="slots"></div>
    <div class="tiles" id="tiles"></div>
    <div class="hint-row"><button class="ghost" id="hint">Gợi ý 1 chữ</button><button class="ghost" id="clear">Xoá hết</button></div>`,
    S.i / S.queue.length);
  $("#hint").addEventListener("click", () => {
    if (S.answered) return;
    // keep the correct prefix, then add the next correct letter
    let k = 0; while (k < S.filled.length && S.tiles[S.filled[k]].ch === letters[k]) k++;
    S.filled = S.filled.slice(0, k);
    const idx = S.tiles.findIndex((t, j) => t.ch === letters[k] && !S.filled.includes(j));
    if (idx >= 0) { S.filled.push(idx); S.hints++; }
    paintSpell(w, letters);
  });
  $("#clear").addEventListener("click", () => { if (!S.answered) { S.filled = []; paintSpell(w, letters); } });
  paintSpell(w, letters);
}
function paintSpell(w, letters) {
  const slots = $("#slots"), tiles = $("#tiles");
  let html = "", li = 0;
  for (const ch of w.w) {
    if (ch === " ") { html += `<span class="slot gap"></span>`; continue; }
    const t = S.filled[li];
    html += `<button class="slot ${t !== undefined ? "filled" : ""}" data-pos="${li}" aria-label="Ô ${li + 1}">${t !== undefined ? S.tiles[t].ch : ""}</button>`;
    li++;
  }
  slots.innerHTML = html;
  tiles.innerHTML = S.tiles.map((t, j) => `<button class="tile" data-j="${j}" ${S.filled.includes(j) ? "disabled" : ""}>${t.ch}</button>`).join("");
  slots.querySelectorAll(".slot[data-pos]").forEach(s => s.addEventListener("click", () => {
    if (S.answered) return;
    const p = +s.dataset.pos; if (p < S.filled.length) { S.filled.splice(p, 1); paintSpell(w, letters); }
  }));
  tiles.querySelectorAll(".tile").forEach(b => b.addEventListener("click", () => {
    if (S.answered) return;
    S.filled.push(+b.dataset.j); paintSpell(w, letters);
  }));
  if (S.filled.length === letters.length && !S.answered) {
    const ok = S.filled.map(j => S.tiles[j].ch).join("") === letters.join("");
    slots.querySelectorAll(".slot[data-pos]").forEach((s, k) => s.classList.add(S.tiles[S.filled[k]].ch === letters[k] ? "right" : "wrong"));
    tiles.querySelectorAll(".tile").forEach(t => t.disabled = true);
    const okFull = ok && S.hints === 0;
    mark(ok, w);
    if (ok && S.hints) { S.score -= Math.min(5 * S.hints, 10); $(".score").textContent = S.score; }
    feedback(ok, w);
    if (ok && !okFull) $(".feedback h3").insertAdjacentText("beforeend", ` (dùng ${S.hints} gợi ý)`);
  }
}

/* ---------- mode 1: flashcards ---------- */
function cardView() {
  if (S.i >= S.queue.length) return cardsDone();
  const w = S.queue[S.i];
  S.score = null;
  frame(`<div class="flip" id="flip">
      <div class="flip-in" tabindex="0" role="button" aria-label="Lật thẻ">
        <div class="face"><img src="${imgOf(w)}" alt="Tranh minh hoạ"><div class="tap">Chạm để lật thẻ</div></div>
        <div class="face back-face"><div class="w">${esc(w.w)}</div><div class="ipa">${esc(w.ipa)}</div><div class="vi">${esc(w.vi)}</div><div class="ex">${esc(w.ex)}</div></div>
      </div></div>
    <div class="fc-nav">
      <button class="btn plain" id="spk">${"Nghe"}</button>
      <button class="btn stay" id="again">Chưa nhớ</button>
      <button class="btn go" id="got">Đã nhớ</button>
    </div>
    <p class="meaning">Thẻ ${S.i + 1} / ${S.queue.length}. Hãy nói từ trước khi lật thẻ.</p>`, S.i / S.queue.length);
  const flip = $("#flip"), inner = $(".flip-in");
  const toggle = () => { flip.classList.toggle("on"); if (flip.classList.contains("on")) say(w.w); };
  inner.addEventListener("click", toggle);
  inner.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(); } });
  $("#spk").addEventListener("click", () => say(w.w));
  $("#got").addEventListener("click", () => { S.known++; S.i++; cardView(); });
  $("#again").addEventListener("click", () => {
    S.wrong.push(w);
    // show this card again later in the deck, once
    if (!w._again) { S.queue.push(Object.assign({}, w, { _again: true })); }
    S.i++; cardView();
  });
}
function cardsDone() {
  const uniqWrong = [...new Map(S.wrong.map(w => [w.w, w])).values()];
  S.wrong = uniqWrong;
  const stars = uniqWrong.length === 0 ? 3 : uniqWrong.length <= 3 ? 2 : 1;
  finish(stars, `Đã xem ${S.pool.length} thẻ. ${uniqWrong.length ? `Còn ${uniqWrong.length} từ chưa nhớ.` : "Em nhớ hết rồi!"}`);
}

/* ---------- mode 5: memory ---------- */
function memoryStart() {
  const pick = shuffle(S.pool).slice(0, 6);
  S.cards = shuffle(pick.flatMap(w => [{ w, kind: "img" }, { w, kind: "txt" }]));
  S.open = []; S.moves = 0; S.pairs = 0; S.lock = false; S.score = null; S.t0 = Date.now();
  frame(`<p class="prompt">Lật 2 thẻ: tìm cặp tranh và từ khớp nhau</p>
    <div class="mem-grid">${S.cards.map((c, k) => `<button class="mem" data-k="${k}" aria-label="Thẻ ${k + 1}"><span class="c">${c.kind === "img" ? `<img src="${imgOf(c.w)}" alt="">` : `<span>${esc(c.w.w)}</span>`}</span></button>`).join("")}</div>
    <div class="mem-info"><span id="moves">Lượt lật: 0</span><span id="pairs">Cặp đúng: 0 / 6</span></div>`, 0);
  app.querySelectorAll(".mem").forEach(b => b.addEventListener("click", () => memFlip(b)));
}
function memFlip(b) {
  const k = +b.dataset.k;
  if (S.lock || b.classList.contains("open") || b.classList.contains("done")) return;
  b.classList.add("open"); S.open.push(k);
  if (S.cards[k].kind === "txt") say(S.cards[k].w.w);
  if (S.open.length < 2) return;
  S.moves++; $("#moves").textContent = `Lượt lật: ${S.moves}`;
  const [a, c] = S.open.map(i => S.cards[i]);
  const els = S.open.map(i => app.querySelector(`.mem[data-k="${i}"]`));
  if (a.w.w === c.w.w && a.kind !== c.kind) {
    els.forEach(e => { e.classList.remove("open"); e.classList.add("done"); e.setAttribute("aria-label", a.w.w); });
    S.open = []; S.pairs++; beep(true); say(a.w.w);
    $("#pairs").textContent = `Cặp đúng: ${S.pairs} / 6`;
    $(".progress i").style.width = (S.pairs / 6 * 100) + "%";
    if (S.pairs === 6) setTimeout(memDone, 700);
  } else {
    S.lock = true; els.forEach(e => e.classList.add("miss"));
    setTimeout(() => { els.forEach(e => e.classList.remove("open", "miss")); S.open = []; S.lock = false; }, 1000);
  }
}
function memDone() {
  const secs = Math.round((Date.now() - S.t0) / 1000);
  const stars = S.moves <= 9 ? 3 : S.moves <= 13 ? 2 : 1;
  finish(stars, `Tìm đủ 6 cặp sau ${S.moves} lượt lật, trong ${secs} giây. (3 sao: tối đa 9 lượt; 2 sao: tối đa 13 lượt)`);
}

/* ---------- results ---------- */
function result() {
  const n = S.queue.length, right = n - S.wrong.length, pct = right / n;
  const stars = pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : pct > 0 ? 1 : 0;
  finish(stars, `Đúng ${right} / ${n} câu – ${S.score} điểm.`);
}
function finish(stars, summary) {
  if (canSpeak) speechSynthesis.cancel();
  if (!S.custom) { const k = bestKey(S.mode); if (stars > store.get(k, 0)) store.set(k, stars); }
  // remember hard words across sessions; drop them once answered correctly in review
  const wrongNames = S.wrong.map(w => w.w);
  if (S.custom) reviewList = reviewList.filter(x => wrongNames.includes(x));
  reviewList = [...new Set(reviewList.concat(wrongNames))];
  store.set("review", reviewList);
  const titles = ["Thử lại nhé!", "Cố lên!", "Giỏi lắm!", "Xuất sắc!"];
  const wl = [...new Map(S.wrong.map(w => [w.w, w])).values()];
  app.innerHTML = `<section class="stage result">
    <h2>${titles[stars]}</h2>
    <div class="big-stars" aria-label="${stars} trên 3 sao">${STAR(stars > 0) + STAR(stars > 1) + STAR(stars > 2)}</div>
    <p class="sum">${summary}</p>
    ${wl.length ? `<p><b>Các từ cần ôn thêm:</b></p><div class="wrong-list">${wl.map(w => `<div><img src="${imgOf(w)}" alt=""><b>${esc(w.w)}</b><span>${esc(w.vi)}</span></div>`).join("")}</div>` : ""}
    <div class="fc-nav">
      <button class="btn plain" id="r-home">Về bản đồ</button>
      ${wl.length && S.mode !== "memory" ? `<button class="btn stay" id="r-wrong">Ôn các từ sai</button>` : ""}
      <button class="btn go" id="r-again">Chơi lại</button>
    </div></section>`;
  $("#r-home").addEventListener("click", home);
  $("#r-again").addEventListener("click", () => start(S.mode, S.custom ? S.pool : null));
  const rw = $("#r-wrong"); if (rw) rw.addEventListener("click", () => start(S.mode, wl));
  if (stars >= 2) beep(true);
  window.scrollTo(0, 0);
}

/* ---------- keyboard: 1–4 to answer, Enter for next ---------- */
document.addEventListener("keydown", e => {
  if (!S || e.altKey || e.ctrlKey || e.metaKey) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4) {
    const opts = app.querySelectorAll(".opt, .pic-opt");
    if (opts[n - 1] && !S.answered) opts[n - 1].click();
  }
});

paintHeader();
home();
</script>
</body>
</html>
